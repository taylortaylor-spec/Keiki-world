<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Keiki — A Few Ways to Find Me</title>
  <meta
    name="description"
    content="Keiki’s official website, inquiries, private collection, wishlists, newsletter, and social accounts."
  >

  <link rel="canonical" href="https://discoverkeiki.com/links.html">
  <meta name="theme-color" content="#142331">
  <meta property="og:title" content="Keiki — A Few Ways to Find Me">
  <meta
    property="og:description"
    content="Keiki’s official website, inquiries, social accounts, and more."
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=Jost:wght@400;500&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      color-scheme: dark;
      --night: #142331;
      --paper: #f5efe5;
      --rose: #d3afa8;
      --muted: #c4c8c8;
      --line: #ffffff26;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--night);
      color: var(--paper);
      font-family: "EB Garamond", Georgia, serif;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 3px solid var(--rose);
      outline-offset: 5px;
    }

    .page {
      max-width: 1180px;
      min-height: 100svh;
      margin: auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .portrait-panel {
      position: sticky;
      top: 0;
      height: 100svh;
      min-height: 780px;
      overflow: hidden;
      isolation: isolate;
    }

    .portrait {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 60% 15%;
      z-index: -3;
    }

    .portrait-panel::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background: linear-gradient(
        180deg,
        transparent 45%,
        #142331b3 80%,
        var(--night) 100%
      );
    }

    .portrait-caption {
      position: absolute;
      bottom: 46px;
      left: 40px;
      right: 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font: 10px "Jost", Arial, sans-serif;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--paper);
    }

    .caption-line {
      height: 1px;
      background: #ffffff55;
      width: 66px;
    }

    main {
      position: relative;
      align-self: center;
      padding: 54px 44px 34px;
      background: radial-gradient(
        ellipse at 100% 0%,
        #74606b24,
        transparent 64%
      );
    }

    h1 {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 400;
      font-style: italic;
      letter-spacing: -0.06em;
      font-size: clamp(4.5rem, 8vw, 6.6rem);
      line-height: 0.95;
      margin: 0 0 23px;
    }

    .links {
      display: grid;
      gap: 11px;
    }

    .link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border: 1px solid var(--line);
      padding: 17px 19px;
      border-radius: 4px;
      background: #ffffff06;
      transition: background 0.2s, border-color 0.2s;
    }

    .link:hover {
      background: #ffffff10;
      border-color: #d3afa8aa;
    }

    .link strong {
      display: block;
      font: 500 12px "Jost", Arial, sans-serif;
      letter-spacing: 0.025em;
    }

    .link .arrow {
      font-size: 1.3rem;
      color: var(--rose);
    }

    .featured {
      background: var(--paper);
      color: var(--night);
      border-color: var(--paper);
    }

    .featured .arrow {
      color: var(--night);
    }

    .featured:hover {
      background: #e5d6c7;
      border-color: #e5d6c7;
    }

    .age {
      font: 10px "Jost", Arial, sans-serif;
      border: 1px solid #ffffff55;
      border-radius: 3px;
      padding: 2px 4px;
      margin-left: 6px;
      color: var(--muted);
      vertical-align: middle;
    }

    .socials {
      display: flex;
      flex-wrap: wrap;
      gap: 0;
      margin: 25px 0 22px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 14px 0;
    }

    .socials a {
      font: 11px "Jost", Arial, sans-serif;
      display: inline-block;
      padding: 9px 10px;
      color: var(--paper);
      text-underline-offset: 5px;
    }

    .socials a:first-child {
      padding-left: 0;
    }

    .socials a:hover {
      text-decoration: underline;
      color: var(--rose);
    }

    footer {
      font-size: 1rem;
      font-style: italic;
      color: var(--rose);
      line-height: 1.5;
    }

    .copyright {
      display: block;
      font: 9px "Jost", Arial, sans-serif;
      letter-spacing: 0.12em;
      color: #a2adb4;
      margin-top: 14px;
    }

    @media (min-width: 1180px) {
      body {
        background: radial-gradient(
          ellipse at 15% 50%,
          #253646,
          #142331 70%
        );
      }
    }

    @media (max-width: 760px) {
      .page {
        display: block;
        max-width: 540px;
      }

      .portrait-panel {
        position: relative;
        height: 510px;
        min-height: 0;
      }

      .portrait {
        object-position: 60% 18%;
      }

      .portrait-panel::after {
        background: linear-gradient(
          180deg,
          transparent 48%,
          #1423314d 72%,
          var(--night) 100%
        );
      }

      .portrait-caption {
        bottom: 70px;
        left: 26px;
        right: 26px;
      }

      main {
        padding: 0 26px 32px;
        margin-top: -30px;
        background: none;
      }

      h1 {
        font-size: 5.4rem;
        margin-bottom: 19px;
      }

      .link {
        padding: 17px;
      }

      .socials a {
        padding: 9px 12px;
      }
    }

    @media (max-width: 360px) {
      main {
        padding-left: 20px;
        padding-right: 20px;
      }

      .portrait-panel {
        height: 455px;
      }

      .socials a {
        padding: 9px;
      }

      h1 {
        font-size: 4.7rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <div class="portrait-panel">
      <img

        src="keiki-portrait.jpeg"
        alt="Keiki in a navy top and jeans, her hair spread around her"

      >

      <div class="portrait-caption">
        <span>Seattle &amp; elsewhere</span>
        <span class="caption-line" aria-hidden="true"></span>

    </div>

    <main>
      <header>

      </header>

      <div class="links" aria-label="Official Keiki links">

        <a class="link featured" href="https://discoverkeiki.com/">

        <a

          target="_blank"
          rel="noopener noreferrer"
        >
          <span><strong>Book wishlist</strong></span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>

        <a
          class="link"
          href="https://www.goodreads.com/user/show/92268401-k-l-3"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span><strong>Goodreads</strong></span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>

        <a
          class="link"
          href="https://forms.gle/LQGqQFCUZRZs9VYx9"

          rel="noopener noreferrer"

          <span><strong>Newsletter</strong></span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>

      </div>

      <div class="socials" aria-label="Social accounts and email">
        <a
          href="https://x.com/keikimuse"
          target="_blank"
          rel="noopener noreferrer"

        <a
          href="https://instagram.com/keiki_sea"

          rel="noopener noreferrer"

        <a
          href="https://bsky.app/profile/keikinw"

          rel="noopener noreferrer"
        >Bluesky ↗</a>

        <a href="mailto:keikipacificmuse@gmail.com">Email ↗</a>
      </div>

      <footer>
        <span class="copyright">© 2026 KEIKI · OFFICIAL LINKS</span>
      </footer>
    </main>

  </div>
</body>
</html>
